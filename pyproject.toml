[project]
name = "rokoko-teleop"
version = "0.1.0"
description = "Rokoko Smartgloves -> dexterous robot hand teleoperation in MuJoCo, with demonstration recording"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
teleop = "rokoko_teleop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rokoko_teleop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
