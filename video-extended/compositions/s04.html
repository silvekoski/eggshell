<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s04-sk { left: 120px; top: 130px; width: 640px; height: 640px; }
    #s04-sksvg { position: absolute; left: 0; top: 0; width: 640px; height: 640px; }
    #s04-skl { left: 120px; top: 790px; width: 640px; font-size: 28px; color: var(--grey); }
    #s04-stage .step { position: absolute; left: 800px; font-size: 34px; padding: 8px 18px; }
    #s04-ang { left: 800px; top: 384px; width: 1024px; height: 200px; }
    #s04-stage .lbl { position: absolute; left: 22px; top: 14px; font-size: 28px; font-weight: 600; }
    #s04-stage .lbl span { font-family: var(--mono); color: var(--grey); font-weight: 400; }
    #s04-stage .bars { position: absolute; left: 22px; right: 22px; bottom: 18px; height: 110px; }
    #s04-stage .b { position: absolute; bottom: 0; border-radius: 4px 4px 0 0; transform-origin: 50% 100%; height: 110px; }
    #s04-o1 { left: 800px; top: 610px; width: 470px; height: 200px; }
    #s04-o2 { left: 1290px; top: 610px; width: 260px; height: 200px; }
    #s04-o3 { left: 1570px; top: 610px; width: 254px; height: 200px; }
    #s04-o3 .w { position: absolute; left: 22px; top: 70px; font-family: var(--mono); font-size: 28px; color: var(--ink); line-height: 1.4; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">
    <div class="stage" id="s04-stage">
      <div class="chapter">Retargeting</div>
      <div class="simchip" id="s04-sim">glove input: simulated</div>
      <div class="panel" id="s04-sk"><svg id="s04-sksvg" viewBox="0 0 640 640"></svg></div>
      <div class="abs" id="s04-skl">26 OpenXR joints, episode 0 (scripted operator)</div>
      <div class="chip grey step" id="s04-st1" style="top: 130px">1 · Z-up, then yaw calibration: fingers forward</div>
      <div class="chip grey step" id="s04-st2" style="top: 218px">2 · each angle: a bone relative to its parent</div>
      <div class="chip grey step" id="s04-st3" style="top: 306px">3 · flat hand for 5 s sets the zero · one-euro filter</div>
      <div class="panel" id="s04-ang"><div class="lbl">human angles <span>21</span></div><div class="bars" id="s04-ab"></div></div>
      <div class="panel" id="s04-o1"><div class="lbl">Shadow actuators <span>20</span></div><div class="bars" id="s04-sb"></div></div>
      <div class="panel" id="s04-o2"><div class="lbl">Inspire <span>6</span></div><div class="bars" id="s04-ib"></div></div>
      <div class="panel" id="s04-o3"><div class="lbl">wrist</div><div class="w">target pose<br />→ mocap</div></div>
    </div>
  </div>
  <script>
    (function () {
      const V = window.VID, S = "s04";
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      V.sceneEnvelope(tl, "#s04-stage", S);
      V.header(document.querySelector("#s04-stage"), tl);
      const E = V.data.egg, N = E.glove.length;
      // skeleton: oblique view of the joints relative to the wrist (x forward, y left, z up)
      const svg = $("s04-sksvg"), SC = 2300, CX = 210, CY = 330;
      const proj = (p) => [CX + p[0] * SC + p[1] * SC * 0.25, CY - p[2] * SC + p[1] * SC * 0.6];
      const bones = [];
      [[1, 2, 3, 4, 5], [1, 6, 7, 8, 9, 10], [1, 11, 12, 13, 14, 15], [1, 16, 17, 18, 19, 20], [1, 21, 22, 23, 24, 25]].forEach((ch) => {
        for (let i = 0; i + 1 < ch.length; i++) bones.push([ch[i], ch[i + 1], V.svg("line", { stroke: "#FFFFFF", "stroke-width": 5, "stroke-linecap": "round" }, svg)]);
      });
      const dots = E.glove[0].map((_, j) => V.svg("circle", { r: j === 1 ? 10 : 6, fill: j === 1 ? "#FFFFFF" : "#FFFFFF" }, svg));
      // bars
      const mk = (box, n, w, gap, color) => Array.from({ length: n }, (_, i) => { const b = V.el("div", "b", $(box)); b.style.left = i * (w + gap) + "px"; b.style.width = w + "px"; b.style.background = color; return b; });
      const ab = mk("s04-ab", 21, 38, 8, "#FFFFFF"), sb = mk("s04-sb", 20, 17, 5, "#FFFFFF"), ib = mk("s04-ib", 6, 30, 6, "#9A9A9A");
      const o = { k: 0 };
      const clamp = (x) => Math.max(0.02, Math.min(1, x));
      const show = () => {
        const k = Math.min(N - 1, Math.round(o.k));
        const P = E.glove[k].map(proj);
        bones.forEach(([a, b, l]) => { l.setAttribute("x1", P[a][0]); l.setAttribute("y1", P[a][1]); l.setAttribute("x2", P[b][0]); l.setAttribute("y2", P[b][1]); });
        dots.forEach((d, j) => { d.setAttribute("cx", P[j][0]); d.setAttribute("cy", P[j][1]); });
        ab.forEach((b, i) => { b.style.transform = "scaleY(" + clamp(Math.abs(E.angles[k][i]) / 1.6) + ")"; });
        sb.forEach((b, i) => { b.style.transform = "scaleY(" + clamp(Math.abs(E.action[k][i]) / 1.8) + ")"; });
        ib.forEach((b, i) => { b.style.transform = "scaleY(" + clamp(E.inspire[k][i] / 1000) + ")"; });
      };
      show();
      tl.fromTo(o, { k: 0 }, { k: N - 1, duration: V.dur(S) - 0.6, ease: "none", onUpdate: show }, 0.3);
      V.enter(tl, "#s04-sk", 0.2, { y: 0 });
      V.enter(tl, "#s04-skl", 0.4, { y: 0 });
      V.enter(tl, "#s04-sim", 0.3);
      V.enter(tl, "#s04-st1", V.t(S, "Frames turn"));
      V.enter(tl, "#s04-st2", V.t(S, "Each angle comes"));
      V.enter(tl, "#s04-st3", V.t(S, "A flat hand"));
      V.enter(tl, "#s04-ang", V.t(S, "Twenty-one human angles"));
      V.enter(tl, "#s04-o1", V.t(S, "twenty Shadow"));
      V.enter(tl, "#s04-o2", V.t(S, "six Inspire"));
      V.enter(tl, "#s04-o3", V.t(S, "six Inspire") + 0.5);
      window.__timelines[S] = tl;
    })();
  </script>
</template>
