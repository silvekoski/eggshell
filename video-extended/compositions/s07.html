  <script>
    (function () {
      const V = window.VID, S = "s07";
      const tl = gsap.timeline({ paused: true });
      V.sceneEnvelope(tl, "#s07-stage", S);
      V.header(document.querySelector("#s07-stage"), tl);
      const ends = [0.2 + 9.63, 0.2 + 6.15, 0.2 + 7.75, 0.2 + 5.75];
      const word = { lifted: "lifted", crushed: "crushed", not_lifted: "not lifted" };
      const led = { lifted: "led", crushed: "led red", not_lifted: "led grey" };
      const cue = V.timing.cues[S];
      V.enter(tl, ["#s07-e0", "#s07-e1", "#s07-e2", "#s07-e3"], 0.1, { y: 16, stagger: 0.08 });
      V.data.episodes.forEach((e, i) => {
        const cell = document.querySelector("#s07-e" + i), strip = cell.querySelector(".strip");
        V.el("div", "ep", strip, "episode " + e.episode);
        const l = V.el("span", led[e.outcome], strip);
        const lab = V.el("div", "lab" + (e.outcome === "crushed" ? " red" : ""), strip, word[e.outcome]);
        const lift = (e.max_lift_m * 100).toFixed(1) + " cm · ";
        const num = V.el("div", "num", strip, (e.outcome === "crushed" ? "" : lift) + e.peak_force_n.toFixed(2) + " N");
        const at = cue["l" + i][0];
        tl.fromTo([l, lab, num], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, at);
        const last = cell.querySelector(".last");
        gsap.set(last, { opacity: 0 });
        tl.set(last, { opacity: 1 }, Math.min(ends[i], V.dur(S)) - 0.04);
      });
      window.__timelines[S] = tl;
    })();
