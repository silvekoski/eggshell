  <script>
    (function () {
      const V = window.VID, S = "s10";
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      V.sceneEnvelope(tl, "#s10-stage", S);
      V.header(document.querySelector("#s10-stage"), tl);
      V.enter(tl, "#s10-sim", 0.2);
      V.enter(tl, "#s10-stage .colh", 0.2, { stagger: 0.1, y: 0 });
      const tK = V.t(S, "four keyframes");
      V.enter(tl, ["#s10-k0", "#s10-k1", "#s10-k2", "#s10-k3"], tK, { stagger: 0.18 });
      V.enter(tl, ["#s10-l0", "#s10-l1", "#s10-l2", "#s10-l3"], tK + 0.1, { stagger: 0.18, y: 6 });
      // 24 rows of the drop episode log: force (amber) and lift (white)
      const svg = $("s10-tlr"), T = V.data.timeline24;
      const tR = V.t(S, "twenty-four row");
      V.enter(tl, "#s10-tl", tR - 0.2, { y: 0 });
      T.forEach((r, i) => {
        const x = i * 19.1;
        const f = V.svg("rect", { x: x, y: 136 - 120 * r[1] / 4, width: 7, height: 120 * r[1] / 4 + 0.5, fill: "#FFFFFF" }, svg);
        const lh = 120 * Math.max(0, r[2] + 1) / 13;
        const l = V.svg("rect", { x: x + 8, y: 136 - lh, width: 7, height: lh + 0.5, fill: "#FFFFFF" }, svg);
        tl.fromTo([f, l], { opacity: 0 }, { opacity: 1, duration: 0.1 }, tR + i * 0.06);
      });
      V.enter(tl, "#s10-json", V.t(S, "strict JSON"));
      tl.fromTo("#s10-json .a", { backgroundColor: "rgba(255,90,31,0)" }, { backgroundColor: "rgba(255,90,31,0.35)", duration: 0.4 }, V.t(S, "citing a frame"));
      const lit = (sel, t, color) => { V.enter(tl, sel, t); tl.to(sel, { borderColor: color, duration: 0.3 }, t + 0.5); };
      lit("#s10-s1", V.t(S, "bad schema"), "#FFFFFF");
      lit("#s10-s2", V.t(S, "grounding check"), "#FFFFFF");
      lit("#s10-s3", V.t(S, "cross-check"), "#D92D20");
      V.enter(tl, "#s10-bug", V.t(S, "One bug"));
      gsap.set("#s10-fix", { opacity: 0 });
      const tF = V.t(S, "Now it gets");
      tl.to("#s10-bug", { opacity: 0, y: -10, duration: 0.4 }, tF);
      tl.fromTo("#s10-fix", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, tF + 0.1);
      window.__timelines[S] = tl;
    })();
