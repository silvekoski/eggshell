  <script>
    (function () {
      const V = window.VID, S = "s13";
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      V.sceneEnvelope(tl, "#s13-stage", S);
      V.header($("s13-stage"), tl);
      V.enter(tl, "#s13-title", 0.2);
      V.enter(tl, "#s13-data", V.t(S, "four hundred eighty"));
      // a and c are knobs: -1 .. +2 maps to -135 .. +135 degrees
      const box = $("s13-knobs");
      const dials = {};
      [["a", 70], ["c", 400]].forEach(([k, x]) => {
        const kb = V.knob(box, x + 70, 80, 64);
        V.el("div", "kl", box, k).style.cssText = "left:" + (x - 4) + "px; top: 0px";
        const val = V.el("div", "kv", box, "+0.0"); val.style.left = (x + 150) + "px"; val.style.top = "46px";
        const o = { v: 0 };
        const show = () => { kb.set(-135 + 270 * (o.v + 1) / 3); val.textContent = (o.v < -0.001 ? "−" : "+") + Math.abs(o.v).toFixed(1); };
        show();
        dials[k] = (to, at) => tl.to(o, { v: to, duration: 0.9, ease: "power2.inOut", onUpdate: show }, at);
      });
      // the program appears with the voice
      V.enter(tl, "#s13-e0", V.t(S, "We trained"));
      V.enter(tl, "#s13-e1", V.t(S, "fine-tuned"));
      V.enter(tl, "#s13-e2", V.t(S, "crushed ones"));
      V.enter(tl, "#s13-knobs", V.t(S, "task vector"), { y: 8 });
      tl.fromTo(["#s13-h1", "#s13-h2"], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, V.t(S, "We trained"));
      // the three programs wait as labelled columns; each number comes with its words
      ["#s13-c0", "#s13-c1", "#s13-c2"].forEach((c, i) => V.enter(tl, c + " .lab", V.t(S, "fine-tuned") + i * 0.4, { y: 6 }));
      const reveal = (c, t) => { gsap.set(c + " .bn, " + c + " .bl", { opacity: 0 }); tl.to(c + " .bn, " + c + " .bl", { opacity: 1, duration: 0.4 }, t); };
      tl.fromTo(["#s13-v1", "#s13-v2"], { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.6, ease: "power2.inOut" }, V.t(S, "We trained") + 0.3);
      // + tau_lifted: a 0 -> 1
      dials.a(1, V.t(S, "Add the lifted"));
      reveal("#s13-c0", V.t(S, "twenty-seven") - 0.3);
      gsap.set(["#s13-c0s", "#s13-c1s"], { opacity: 0 });
      reveal("#s13-c1", V.t(S, "sixty-seven") - 0.2);
      V.counter(tl, $("s13-n1"), 27, 67, V.t(S, "sixty-seven") - 0.2, 0.8, (x) => Math.round(x) + " %");
      tl.fromTo("#s13-blue", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, V.t(S, "percent"));
      tl.to("#s13-c0s", { opacity: 1, duration: 0.3 }, V.t(S, "sixty-two"));
      tl.to("#s13-c1s", { opacity: 1, duration: 0.3 }, V.t(S, "twenty-eight"));
      // + tau_crushed: a back to 0, c 0 -> 1
      const tC = V.t(S, "Add the crushed");
      dials.a(0, tC - 0.2);
      dials.c(1, tC);
      reveal("#s13-c2", tC);
      gsap.set("#s13-c2 .bs", { opacity: 0 });
      tl.to("#s13-c2 .bs", { opacity: 1, duration: 0.3 }, V.t(S, "eighty-three"));
      V.counter(tl, $("s13-n2"), 62, 83, tC, V.t(S, "eighty-three", 0, "e") - tC, (x) => Math.round(x) + " %");
      // the negative result: c -> -1
      dials.c(-1, V.t(S, "subtracting"));
      V.enter(tl, "#s13-neg1", V.t(S, "subtracting"));
      V.enter(tl, "#s13-neg2", V.t(S, "breaks the reach") + 0.4);
      V.enter(tl, "#s13-foot", V.t(S, "Scripted demonstrations", 1));
      window.__timelines[S] = tl;
    })();
