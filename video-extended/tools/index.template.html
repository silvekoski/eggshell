<!doctype html>
<!-- index.html is written by tools/build.py from tools/index.template.html. Edit the template, then run the build. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{TITLE}}</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/data/data.js"></script>
    <script src="assets/timing.js"></script>
    <script src="assets/lib.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #767676; }
      #bg { position: absolute; inset: 0; background: #767676; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-fps="30" data-width="1920" data-height="1080">
      <div id="bg" data-layout-ignore></div>
{{HOSTS}}
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{TOTAL}}" data-track-index="5" data-track-kind="captions" data-width="1920" data-height="1080"></div>
{{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, {{TOTAL}});
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
